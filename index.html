<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotos para tus estados</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#EDF2EA; --surface:#FFFFFF; --ink:#17291D; --muted:#4F6155; --line:#D3DECF;
  --leaf:#2E6A44; --leaf-ink:#FFFFFF; --leaf-dark:#1F4E31;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1712; --surface:#17231B; --ink:#E4EEE5; --muted:#A9BCAE; --line:#2A3B2F; --leaf:#6FB585; --leaf-ink:#0F1712; --leaf-dark:#8FCBA2; }
}
:root[data-theme="dark"]{ --bg:#0F1712; --surface:#17231B; --ink:#E4EEE5; --muted:#A9BCAE; --line:#2A3B2F; --leaf:#6FB585; --leaf-ink:#0F1712; --leaf-dark:#8FCBA2; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.15;margin:4px 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.ayuda{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:24px}
.ayuda h2{font-size:21px;margin:0 0 10px}
.ayuda ol{margin:0;padding-left:26px}
.ayuda li{margin-bottom:8px}
.ayuda b{color:var(--leaf-dark)}
.foto{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:28px}
.foto img{display:block;width:100%;height:auto;border-radius:12px;background:var(--line)}
.foto p{margin:12px 4px 14px;font-size:19px}
.num{display:inline-block;font-weight:800;color:var(--leaf-dark);margin-bottom:8px;font-size:17px}
button.compartir{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border:0;border-radius:16px;background:var(--leaf);color:var(--leaf-ink);font-size:28px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 var(--leaf-dark)}
button.compartir:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-dark)}
button.compartir svg{width:32px;height:32px;flex:none}
.aviso{display:none;margin:12px 4px 0;padding:12px 14px;border-radius:12px;background:#FBF0CF;color:#4A3B0B;font-size:17px}
.aviso.ver{display:block}
.vacio{text-align:center;color:var(--muted);padding:40px 10px}
footer{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="titulo">Fotos para tus estados</h1>
  <p class="sub" id="fecha"></p>

  <section class="ayuda" aria-label="Cómo se usa">
    <h2>¿Cómo se usa?</h2>
    <ol>
      <li>Tocá el botón verde <b>COMPARTIR</b> debajo de la foto.</li>
      <li>Elegí <b>WhatsApp</b>.</li>
      <li>Tocá <b>Mi estado</b> y después la flechita para enviar.</li>
    </ol>
  </section>

  <div id="fotos"></div>
  <footer>¿Dudas? Escribile a tu líder 🌿</footer>
</main>

<script src="semana.js"></script>
<script>
const S = window.SEMANA || {fotos: []};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>`;

if(S.titulo) $("#titulo").textContent = S.titulo;
if(S.desde) $("#fecha").textContent = "Desde el " + new Date(S.desde + "T00:00").toLocaleDateString("es-AR", {weekday:"long", day:"numeric", month:"long"});

$("#fotos").innerHTML = S.fotos.length ? S.fotos.map((f, i) => `
  <article class="foto">
    <span class="num">Foto ${i + 1} de ${S.fotos.length}</span>
    <img src="${esc(f.archivo)}" alt="${esc(f.texto || "Foto " + (i + 1))}" loading="${i < 2 ? "eager" : "lazy"}">
    ${f.texto ? `<p>${esc(f.texto)}</p>` : `<div style="height:12px"></div>`}
    <button class="compartir" data-i="${i}">${ICONO}COMPARTIR</button>
    <div class="aviso" id="aviso-${i}" role="status"></div>
  </article>`).join("") : `<p class="vacio">Todavía no hay fotos esta semana.</p>`;

document.querySelectorAll("button.compartir").forEach(b => b.onclick = async () => {
  const f = S.fotos[+b.dataset.i], aviso = $("#aviso-" + b.dataset.i);
  aviso.classList.remove("ver");
  try{
    const blob = await (await fetch(f.archivo)).blob();
    const nombre = f.archivo.split("/").pop();
    const file = new File([blob], nombre, {type: blob.type || "image/jpeg"});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file]});
      return;
    }
    // si el celular no deja compartir directo, se guarda la foto
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    aviso.textContent = "La foto se guardó en tu celular. Abrí WhatsApp, entrá a Estados y elegila de la galería.";
    aviso.classList.add("ver");
  }catch(e){
    if(e && e.name === "AbortError") return; // cerró el menú de compartir
    aviso.textContent = "No se pudo compartir. Mantené apretada la foto y elegí «Guardar imagen».";
    aviso.classList.add("ver");
  }
});
</script>
</body>
</html>
